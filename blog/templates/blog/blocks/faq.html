{% load i18n %}
{# Native details keeps each answer independent, keyboard-operable, and useful without JavaScript. #}
<section class="blog-faq" aria-labelledby="blog-faq-{{ item.pk }}-title">
  <h2 id="blog-faq-{{ item.pk }}-title">
    <span class="blog-faq__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" focusable="false">
        <path d="M6 7h8.25a3 3 0 0 1 3 3v3.25a3 3 0 0 1-3 3H10l-4.25 3v-3H6a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z"></path>
        <path d="M8.75 5.25A3 3 0 0 1 11.5 3.5H18a3 3 0 0 1 3 3V10a3 3 0 0 1-2 2.83v2.42l-2.55-1.8"></path>
      </svg>
    </span>
    <span>{% trans "Frequently asked questions" %}</span>
  </h2>
  <div class="blog-faq__items">
    {% for faq_item in item.items %}
      <details class="blog-faq__item">
        <summary class="blog-faq__question">{{ faq_item.question }}</summary>
        <div class="blog-faq__answer blog-rich-text">{{ faq_item.answer }}</div>
      </details>
    {% endfor %}
  </div>
</section>
