{% load i18n %}
<figure class="blog-embed"{% if embed %} data-blog-embed data-blog-embed-platform="{{ embed.platform }}" data-blog-embed-id="{{ embed.item_id }}"{% endif %}>
  {% if embed %}
    {% if embed.platform == 'youtube' %}
      <iframe
        class="blog-embed__youtube"
        src="https://www.youtube-nocookie.com/embed/{{ embed.item_id }}?autoplay=0&amp;playsinline=1&amp;enablejsapi=1{% if embed_origin %}&amp;origin={{ embed_origin|urlencode:"" }}{% endif %}"
        title="{% trans 'Embedded YouTube video' %}"
        allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    {% elif embed.platform == 'x' %}
      <div class="blog-embed__x-target" data-blog-embed-target></div>
    {% elif embed.platform == 'reddit' %}
      <blockquote class="reddit-embed-bq" data-blog-embed-target data-embed-height="316">
        <a href="{{ embed.canonical_url }}" target="_blank" rel="noopener noreferrer">{{ embed.canonical_url }}</a>
      </blockquote>
    {% endif %}
    <div class="blog-embed__fallback" data-blog-embed-fallback hidden aria-live="polite">
      <p>{% trans 'This content is currently unavailable.' %}</p>
    </div>
  {% else %}
    <div class="blog-embed__fallback" aria-live="polite">
      <p>{% trans 'This content is currently unavailable.' %}</p>
    </div>
  {% endif %}
  {% if embed or item.caption %}
    <figcaption class="blog-embed__footer">
      {% if item.caption %}<span class="blog-embed__caption">{{ item.caption }}</span>{% endif %}
      {% if embed %}<a class="blog-embed__source-link" href="{{ embed.canonical_url }}" target="_blank" rel="noopener noreferrer">{% trans 'Open' %}<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 5h5v5"></path><path d="M10 14 19 5"></path><path d="M19 13v5a1 1 0 0 1-1 1h-12a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"></path></svg></a>{% endif %}
    </figcaption>
  {% endif %}
</figure>
